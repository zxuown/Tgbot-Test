# Render Blueprint for Focus Telegram Bot
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: focus-db
    databaseName: focus
    user: focus
    plan: free
    region: frankfurt

services:
  - type: web
    name: focus-bot-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: BOT_MODE
        value: polling
      - key: AUTO_MIGRATE
        value: "true"
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: focus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
