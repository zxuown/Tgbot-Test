services:
  postgres:
    image: postgres:16-alpine
    container_name: focus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focus}
      POSTGRES_DB: ${POSTGRES_DB:-focus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focus} -d ${POSTGRES_DB:-focus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focus-network

  redis:
    image: redis:7-alpine
    container_name: focus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - focus-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - BOT_MODE=api
      - AUTO_MIGRATE=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD:-focus}@postgres:5432/${POSTGRES_DB:-focus}
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - focus-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focus-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - BOT_MODE=worker
      - AUTO_MIGRATE=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-focus}:${POSTGRES_PASSWORD:-focus}@postgres:5432/${POSTGRES_DB:-focus}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - focus-network

volumes:
  postgres_data:
  redis_data:

networks:
  focus-network:
    driver: bridge
